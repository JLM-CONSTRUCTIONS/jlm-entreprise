<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>JLM Constructions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1a33;
  color: #fff;
}

header {
  text-align: center;
  padding: 30px;
  background: #071224;
}

header img {
  max-width: 180px;
  margin-bottom: 15px;
}

.btn {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 25px;
  background: #ff9800;
  color: #000;
  text-decoration: none;
  font-weight: bold;
  border-radius: 5px;
}

section {
  padding: 40px 20px;
  max-width: 1200px;
  margin: auto;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
}

.gallery img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 6px;
  background: #000;
}
</style>
</head>

<body>

<header>
  <img src="logo-jlm.png" alt="Logo JLM">
  <h1>JLM CONSTRUCTIONS</h1>
  <h2>Maçonnerie générale – Gros œuvre – Rénovation</h2>

</header>

    <img src="photos/PHOTO (10).jpg">

</section>

</html>
